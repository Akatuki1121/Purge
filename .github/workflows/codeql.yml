name: "CodeQL"
on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/**"
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # WPF(net10.0-windows)プロジェクトはLinux上では既定でビルド不可(NETSDK1100)。
    # CodeQLの解析はビルドだけできればよいため、EnableWindowsTargeting=trueで
    # Windowsターゲットの参照アセンブリを解決させてビルドを通す。
    env:
      EnableWindowsTargeting: 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
