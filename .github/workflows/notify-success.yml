name: Notify PR Checks Success

# PRのCIワークフローが成功したときにDiscordへ通知する。
# 他のワークフローの成功と誤認させないよう、通知対象をCIに限定する。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  checks: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare success notification
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECKS_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WEBHOOK_URL: ${{ secrets.ACTIONS_NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "ACTIONS_NOTIFY_WEBHOOK_URL が未設定のため、通知を送らずスキップします。"
            exit 0
          fi

          MSG=$(printf '### ✅ PRのCIが成功しました\n\n- PR: https://github.com/%s/pull/%s\n- コミット: `%.7s`\n- CI実行: %s' "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${CHECKS_URL}")
          jq -n --arg c "${MSG}" '{content: $c}' |
            curl --fail-with-body --silent --show-error -X POST \
              -H 'Content-Type: application/json' -d @- "${WEBHOOK_URL}"
