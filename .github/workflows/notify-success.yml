name: Notify PR CI Success

# PRのCIワークフローが成功したときにDiscordへ通知する。
# workflow_run の pull_requests が空になる場合があるため、コミットからPRを解決する。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR and prepare success notification
        id: resolve
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '([.[] | select(.state == "open")][0].number // .[0].number) // empty')
          if [ -z "${PR_NUMBER}" ]; then
            echo "PRに関連付けられないCI実行のため、通知をスキップします。"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: steps.resolve.outputs.pr_number != ''
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          WEBHOOK_URL: ${{ secrets.ACTIONS_NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "ACTIONS_NOTIFY_WEBHOOK_URL が未設定のため、通知を送らずスキップします。"
            exit 0
          fi

          MSG=$(printf '✅ CI成功 — PR #%s: https://github.com/%s/pull/%s' "${PR_NUMBER}" "${REPO}" "${PR_NUMBER}")
          jq -n --arg c "${MSG}" '{content: $c}' |
            curl --connect-timeout 5 --max-time 10 --fail-with-body --silent --show-error -X POST \
              -H 'Content-Type: application/json' -d @- "${WEBHOOK_URL}"
