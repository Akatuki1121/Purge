name: Notify PR CI Success

# PRのCIワークフローが成功したときにDiscordへ通知する。
# workflow_run の pull_requests が空になる場合があるため、コミットからPRを解決する。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR and prepare success notification
        id: resolve
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECKS_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '([.[] | select(.state == "open")][0].number // .[0].number) // empty')
          if [ -z "${PR_NUMBER}" ]; then
            echo "PRに関連付けられないCI実行のため、通知をスキップします。"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "checks_url=${CHECKS_URL}" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: steps.resolve.outputs.pr_number != ''
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          CHECKS_URL: ${{ steps.resolve.outputs.checks_url }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          WEBHOOK_URL: ${{ secrets.ACTIONS_NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "ACTIONS_NOTIFY_WEBHOOK_URL が未設定のため、通知を送らずスキップします。"
            exit 0
          fi

          MSG=$(printf '### ✅ PRのCIが成功しました\\n\\n- PR: https://github.com/%s/pull/%s\\n- コミット: `%.7s`\\n- CI実行: %s' "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${CHECKS_URL}")
          jq -n --arg c "${MSG}" '{content: $c}' |
            curl --fail-with-body --silent --show-error -X POST \
              -H 'Content-Type: application/json' -d @- "${WEBHOOK_URL}"
