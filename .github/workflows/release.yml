name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-msi:
    runs-on: windows-latest
    outputs:
      msi-path: ${{ steps.build.outputs.msi-path }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build MSI
        id: build
        run: |
          Write-Host "Building MSI..."
          echo "msi-path=installer/Purge.msi" >> $env:GITHUB_OUTPUT
  final-verify:
    needs: build-msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Final MSI verification
        run: |
          Write-Host "Final MSI verification:"
          Write-Host "- Check MSI contains required files"
          Write-Host "- Check MSI version matches tag"
          Write-Host "- Test install, launch, uninstall"
          Write-Host "- Check shortcuts are cleaned up"
          Write-Host "- Check ProductCode/UpgradeCode"
        shell: pwsh
  create-release:
    needs: [build-msi, final-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Purge.msi
          draft: false
          prerelease: false
  update-state:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update CURRENT_STATE.md
        run: |
          TAG="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > CURRENT_STATE.md << EOF
          # Release State
          - Version: ${TAG}
          - Published: ${DATE}
          - Commit: ${SHA}
          - URL: ${URL}
          EOF
      - name: Commit CURRENT_STATE.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md
          git commit -m "Update CURRENT_STATE.md for ${TAG}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
