name: Release

# タグ(v*)のpush、または main からの手動実行で配布用MSI(ja/en)をビルドする。
# 公開前の最終検証(#107)に失敗した場合はタグ作成・リリース公開を行わない。
# 公開成功後は CURRENT_STATE.md を更新する(#108)。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.5.0; omit the v prefix)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine and validate release version
        id: ver
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw 'Manual releases must be dispatched from main.'
            }
            if ($env:RELEASE_VERSION_INPUT -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Version must use MAJOR.MINOR.PATCH format without a v prefix (for example 1.5.0).'
            }
            $tag = "v$env:RELEASE_VERSION_INPUT"
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Invalid release tag: $tag"
            }
          }
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore UI/Purge.UI.csproj --runtime win-x64
          dotnet restore installer/Purge.Installer.wixproj

      - name: Publish self-contained package
        run: dotnet publish UI/Purge.UI.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/Purge -p:Version=${{ steps.ver.outputs.version }} --no-restore

      - name: Build and stage WiX installer (ja-JP / en-US)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item dist -ItemType Directory -Force | Out-Null

          # Build and copy each culture before building the next one.
          # The next WiX build can clean the previous culture's output.
          dotnet build installer/Purge.Installer.wixproj -p:Platform=x64 -p:Configuration=Release -p:ProductVersion=$v -p:Cultures=ja-JP --no-restore
          Copy-Item 'installer/bin/x64/Release/ja-JP/Purge.Installer.msi' "dist/Purge-$v-win-x64-ja.msi"

          dotnet build installer/Purge.Installer.wixproj -p:Platform=x64 -p:Configuration=Release -p:ProductVersion=$v -p:Cultures=en-US --no-restore
          Copy-Item 'installer/bin/x64/Release/en-US/Purge.Installer.msi' "dist/Purge-$v-win-x64-en.msi"

          Get-ChildItem dist

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-msi
          path: dist/

  final-verify:
    needs: build-msi
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download MSI artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-msi
          path: dist

      - name: Download latest released MSI (upgrade baseline)
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$REPO/releases" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
            mkdir -p baseline/ja baseline/en
            gh release download "$TAG" --repo "$REPO" --pattern '*-ja.msi' --dir baseline/ja --clobber
            gh release download "$TAG" --repo "$REPO" --pattern '*-en.msi' --dir baseline/en --clobber
            mv baseline/ja/*-ja.msi baseline/baseline-ja.msi
            mv baseline/en/*-en.msi baseline/baseline-en.msi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "ベースライン(直前の公開済みリリース): $TAG"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "公開済みリリースがないため、ベースライン比較をスキップします。"
          fi

      - name: Final MSI verification
        shell: pwsh
        run: |
          $v = '${{ needs.build-msi.outputs.version }}'
          foreach ($culture in @('ja', 'en')) {
            Write-Host "=== Release MSI verification: $culture ==="
            $msi = "$PWD/dist/Purge-$v-win-x64-$culture.msi"
            $params = @{ MsiPath = $msi; ExpectedVersion = $v }
            $baseline = "$PWD/baseline/baseline-$culture.msi"
            if (Test-Path $baseline) { $params.BaselineMsiPath = $baseline }

            # Verify-ReleaseMsi.ps1 calls exit on completion. Run it in a child
            # PowerShell process so a successful Japanese check cannot terminate
            # this loop before the English MSI is verified.
            $arguments = @('-NoProfile', '-File', (Join-Path $PWD 'scripts/Verify-ReleaseMsi.ps1'),
              '-MsiPath', $msi, '-ExpectedVersion', $v)
            if (Test-Path $baseline) { $arguments += @('-BaselineMsiPath', $baseline) }
            & pwsh @arguments
            $verifyExit = $LASTEXITCODE
            if ($verifyExit -ne 0) { exit $verifyExit }
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-verify-logs
          path: |
            ${{ runner.temp }}/purge_install.log
            ${{ runner.temp }}/purge_uninstall.log
          if-no-files-found: ignore

  create-release:
    needs: [build-msi, final-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-msi.outputs.sha }}

      - name: Download MSI artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-msi
          path: dist

      - name: Create tag for manually dispatched release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ needs.build-msi.outputs.tag }}
          TARGET_SHA: ${{ needs.build-msi.outputs.sha }}
        run: |
          set -euo pipefail
          # Allow retrying a failed release run if its tag already points to this same commit.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            existing_sha="$(git rev-parse "${TAG}^{commit}")"
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "Tag ${TAG} already exists at ${existing_sha}, not ${TARGET_SHA}. Refusing to overwrite it." >&2
              exit 1
            fi
            echo "Tag ${TAG} already points to the release commit; continuing safely."
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build-msi.outputs.tag }}
          VERSION: ${{ needs.build-msi.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.msi \
            --repo "$REPO" \
            --title "Purge $VERSION" \
            --generate-notes

  update-state:
    needs: [create-release, build-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update state on a unique branch
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.build-msi.outputs.tag }}
          SHA: ${{ needs.build-msi.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="${GITHUB_SERVER_URL}/${REPO}/releases/tag/${TAG}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BRANCH="automation/release-state-${TAG//./-}-${RUN_ID}"
          {
            echo "# リリース状態 (CURRENT_STATE)"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 最新公開バージョン | ${VERSION} |"
            echo "| 公開日時 | ${DATE} |"
            echo "| コミット | \`${SHA}\` |"
            echo "| Release URL | ${URL} |"
            echo ""
            echo "- このファイルはGitHub Release公開成功時にのみ自動更新されます(#108)。"
          } > CURRENT_STATE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add CURRENT_STATE.md
          git commit -m "chore: CURRENT_STATE.md を ${TAG} に更新"
          git push --set-upstream origin "${BRANCH}"
          PR_URL=$(gh pr create --repo "${REPO}" --base main --head "${BRANCH}" \
            --title "chore: update CURRENT_STATE for ${TAG}" \
            --body "Automated release-state update after successful release and MSI verification for ${TAG}.")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          gh pr merge "${PR_URL}" --repo "${REPO}" --auto --squash
