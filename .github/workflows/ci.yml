name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UI/Purge.UI.csproj --runtime win-x64

      - name: Build Core and UI
        run: dotnet build UI/Purge.UI.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Tests/Purge.Tests.csproj --configuration Release --no-restore

      - name: Publish self-contained package
        run: dotnet publish UI/Purge.UI.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Purge --no-restore

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Purge-win-x64
          path: artifacts/Purge/