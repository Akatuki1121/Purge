name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.changes.outputs.installer }}
      core: ${{ steps.changes.outputs.core }}
      ui: ${{ steps.changes.outputs.ui }}
      docs-only: ${{ steps.changes.outputs.docs-only }}
      workflow-only: ${{ steps.scope.outputs.workflow-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            installer:
              - 'installer/**'
              - 'Core/UpdateDownloader.cs'
              - 'scripts/Verify-MsiUpgrade.ps1'
            core:
              - 'Core/**'
            ui:
              - 'UI/**'
            docs-only:
              - 'README.md'
              - 'README.en.md'
              - 'CHANGELOG.md'
              - 'ROADMAP.md'
              - '判断基準.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
              - '.gitleaks.toml'
              - '*.md'
      - name: Classify workflow-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            RANGE="$BASE...$GITHUB_SHA"
          else
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              echo "workflow-only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="$BASE..$GITHUB_SHA"
          fi
          FILES=$(git diff --name-only "$RANGE")
          if [ -n "$FILES" ] && ! printf '%s\n' "$FILES" | grep -qv '^.github/workflows/'; then
            echo "workflow-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflow-only=false" >> "$GITHUB_OUTPUT"
          fi
  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.workflow-only != 'true' && (needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.docs-only != 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build
  msi-verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.installer == 'true'
    uses: ./.github/workflows/verify-msi.yml
