name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.changes.outputs.installer }}
      core: ${{ steps.changes.outputs.core }}
      ui: ${{ steps.changes.outputs.ui }}
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            installer:
              - 'installer/**'
              - 'Core/UpdateDownloader.cs'
              - 'scripts/Verify-MsiUpgrade.ps1'
              - '.github/workflows/**'
            core:
              - 'Core/**'
            ui:
              - 'UI/**'
            docs-only:
              - 'README.md'
              - 'README.en.md'
              - 'CHANGELOG.md'
              - 'ROADMAP.md'
              - '判断基準.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
              - '.gitleaks.toml'
              - '*.md'
  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.docs-only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build
  msi-verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.installer == 'true'
    uses: ./.github/workflows/verify-msi.yml
