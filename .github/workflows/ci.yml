name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.changes.outputs.installer }}
      core: ${{ steps.changes.outputs.core }}
      ui: ${{ steps.changes.outputs.ui }}
      lightweight-only: ${{ steps.scope.outputs.lightweight-only }}
      workflow-only: ${{ steps.scope.outputs.workflow-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            installer:
              - 'installer/**'
              - 'Core/UpdateDownloader.cs'
              - 'scripts/Verify-MsiUpgrade.ps1'
            core:
              - 'Core/**'
            ui:
              - 'UI/**'
      - name: Classify change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            RANGE="$BASE...$GITHUB_SHA"
          else
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              echo "workflow-only=false" >> "$GITHUB_OUTPUT"
              echo "lightweight-only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="$BASE..$GITHUB_SHA"
          fi

          # Include both sides of renames so moving code into an allowed path cannot hide its removal.
          FILES=$(git diff --name-only --no-renames "$RANGE")
          WORKFLOW_ONLY=true
          LIGHTWEIGHT_ONLY=true
          if [ -z "$FILES" ]; then
            WORKFLOW_ONLY=false
            LIGHTWEIGHT_ONLY=false
          else
            while IFS= read -r file; do
              [[ "$file" == .github/workflows/* ]] || WORKFLOW_ONLY=false

              case "$file" in
                README.md|README.en.md|CHANGELOG.md|ROADMAP.md|判断基準.md|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml|.gitleaks.toml)
                  ;;
                *)
                  if [[ "$file" != */* && "$file" == *.md ]]; then
                    :
                  else
                    LIGHTWEIGHT_ONLY=false
                  fi
                  ;;
              esac
            done <<< "$FILES"
          fi

          echo "workflow-only=$WORKFLOW_ONLY" >> "$GITHUB_OUTPUT"
          echo "lightweight-only=$LIGHTWEIGHT_ONLY" >> "$GITHUB_OUTPUT"
  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.workflow-only != 'true' && needs.detect-changes.outputs.lightweight-only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build
  msi-verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.installer == 'true'
    uses: ./.github/workflows/verify-msi.yml
