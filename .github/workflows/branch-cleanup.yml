name: Branch Cleanup
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup merged branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          echo "## Branch Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # remote-query failure must fail the job, not look like a deleted branch.
          REMOTE_REF=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          if [[ -n "$REMOTE_REF" ]]; then
            echo "Deleting branch: $BRANCH"
            git push origin --delete "$BRANCH"
            echo "- ✅ Deleted: `$BRANCH`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ℹ️ Branch already deleted: `$BRANCH`" >> "$GITHUB_STEP_SUMMARY"
          fi
