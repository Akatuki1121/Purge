name: PR Summary

# PRの作成・更新時に、mainからの乖離状況と影響範囲をJob Summaryへ出力する(#111)。
# コメントは作成せず、Job Summaryで確認できる構成にする。

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/**"
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write PR summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          BASE=$(git merge-base origin/main "$HEAD_SHA")

          DIFFSTAT=$(git diff --shortstat "$BASE" "$HEAD_SHA" || true)
          FILES=$(git diff --name-only "$BASE" "$HEAD_SHA" || true)
          CHANGED=$(echo "$FILES" | grep -c . || true)
          ADD_DEL=$(echo "$DIFFSTAT" | grep -oE '[0-9]+ insertion[s]?\([+]\), [0-9]+ deletion[s]?\([-]\)' || echo '-')

          AHEAD=$(git rev-list --count "origin/main..$HEAD_SHA" 2>/dev/null || echo '?')
          BEHIND=$(git rev-list --count "$HEAD_SHA..origin/main" 2>/dev/null || echo '?')

          # インストーラー・更新機能への変更
          INSTALLER_FILES=$(echo "$FILES" | grep -cE '^(installer/|Core/Update|scripts/Verify-MsiUpgrade)' || true)
          MATRIX_FILES=$(echo "$FILES" | grep -cE '^(installer/|Core/UpdateDownloader\.cs$|scripts/Verify-MsiUpgrade\.ps1$|\.github/workflows/verify-msi-matrix\.yml$)' || true)

          # CIと同じ許可リストで、変更ファイルがすべてドキュメントかを判定
          DOCS_ONLY=true
          if [ "$CHANGED" -eq 0 ]; then
            DOCS_ONLY=false
          else
            while IFS= read -r file; do
              case "$file" in
                README.md|README.en.md|CHANGELOG.md|ROADMAP.md|判断基準.md|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml|.gitleaks.toml)
                  ;;
                *)
                  if [[ "$file" != */* && "$file" == *.md ]]; then
                    :
                  else
                    DOCS_ONLY=false
                  fi
                  ;;
              esac
            done <<< "$FILES"
          fi
          DOCS_ONLY=$([ "$DOCS_ONLY" = "true" ] && echo はい || echo いいえ)

          # CHANGELOG.mdの更新
          CHANGELOG=$(echo "$FILES" | grep -c '^CHANGELOG\.md$' || true)
          # 関連Issueへの参照
          ISSUE_REFS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '[body | scan("#[0-9]+")] | unique | join(", ")' 2>/dev/null || echo '')
          [ -z "$ISSUE_REFS" ] && ISSUE_REFS='(なし)'

          # CIの実行条件と一致させる。ドキュメントのみなら重いビルド・テストは省略。
          CHECKS=""
          if [ "$DOCS_ONLY" = "はい" ]; then
            CHECKS+=$'- ドキュメントのみのため、ビルド・単体テストはスキップされます\n'
          else
            CHECKS+=$'- ビルド・単体テスト(ci.yml / build-and-test)\n'
          fi
          if [ "$INSTALLER_FILES" -gt 0 ]; then
            CHECKS+=$'- MSI検証(ci.yml / verify-msi.yml)\n'
            CHECKS+=$'- MSI更新互換性マトリクス(Verify MSI Upgrade Matrix)\n'
          fi
          [ -z "$CHECKS" ] && CHECKS="- (対象なし)"

          {
            echo "## PRサマリー (#${PR_NUMBER})"
            echo ""
            echo "### mainからの乖離状況"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 先行コミット数 | ${AHEAD} |"
            echo "| 落後コミット数 | ${BEHIND} |"
            echo ""
            echo "### 変更の規模"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 変更ファイル数 | ${CHANGED} |"
            echo "| 追加・削除行 | ${ADD_DEL} |"
            echo ""
            echo "### 影響範囲"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| インストーラー・更新機能への変更 | $([ "$INSTALLER_FILES" -gt 0 ] && echo あり || echo なし) |"
            echo "| ドキュメントのみの変更 | ${DOCS_ONLY} |"
            echo "| CHANGELOG.md の更新 | $([ "$CHANGELOG" -gt 0 ] && echo あり || echo なし) |"
            echo "| 関連Issue | ${ISSUE_REFS} |"
            echo ""
            echo "### 実行対象となる検証"
            echo ""
            printf '%s' "$CHECKS"
          } >> "$GITHUB_STEP_SUMMARY"
