name: Issue Relation Analysis

# 全件走査や文章類似度での推測を避け、根拠が強い関係だけを提示する。
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-relations-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.issue.pull_request == null && github.event.issue.number != 178
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find evidence-backed relations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/issue-relation-analysis.py
