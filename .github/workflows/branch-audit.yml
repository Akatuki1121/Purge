name: Branch Audit
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit branches
        run: |
          echo "## Branch Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Branches without PR" >> $GITHUB_STEP_SUMMARY
          git fetch --all
          for branch in $(git branch -r | grep -v 'origin/main' | grep -v 'origin/HEAD'); do
            echo "- $branch" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commits ahead of main" >> $GITHUB_STEP_SUMMARY
          for branch in $(git branch -r | grep -v 'origin/main' | grep -v 'origin/HEAD'); do
            AHEAD=$(git rev-list --count "origin/main..$branch" 2>/dev/null || echo "0")
            echo "- $branch: $AHEAD commits ahead" >> $GITHUB_STEP_SUMMARY
          done
