name: Branch Audit

# PR未作成ブランチとmainからの乖離をJob Summaryで可視化する(#111)。
# 週次(月曜 09:00 JST)と手動実行。
# 監査結果をもとにIssueやPRコメントは自動作成しない(通知を増やさない)。

on:
  schedule:
    - cron: '0 0 * * 1'  # 月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          BRANCH_REFS=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v '^origin/main$' || true)

          # PR一覧を一度だけ取得し、ブランチ数に比例するAPI呼び出しを避ける。
          # 取得失敗時は「PR未作成」と断定せず、各ブランチを確認失敗として残す。
          if PR_HEADS=$(gh pr list --repo "$REPO" --state all --limit 1000 --json headRefName,headRepository,headRepositoryOwner | jq -r --arg owner "${REPO%%/*}" --arg repo "${REPO#*/}" '.[] | select(.headRepository.name == $repo and .headRepositoryOwner.login == $owner) | .headRefName'); then
            PR_QUERY_OK=true
          else
            PR_QUERY_OK=false
            PR_HEADS=""
          fi

          {
            echo "## ブランチ監査"
            echo ""
            echo "- 実行日時: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### PR未作成ブランチ"
            echo ""
            echo "| ブランチ | mainからの先行コミット数 | 最終更新日時 | PR確認 |"
            echo "| --- | --- | --- | --- |"
            found=0
            for ref in $BRANCH_REFS; do
              branch="${ref#origin/}"
              if [ "$PR_QUERY_OK" = true ]; then
                if grep -Fxq -- "$branch" <<< "$PR_HEADS"; then
                  continue
                fi
                pr_status="未作成"
              else
                pr_status="確認失敗"
              fi
              ahead=$(git rev-list --count "origin/main..refs/remotes/origin/$branch" 2>/dev/null || echo '?')
              last=$(git log -1 --format='%ci' "refs/remotes/origin/$branch" | cut -d' ' -f1)
              echo "| `$branch` | $ahead | $last | $pr_status |"
              found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "| (PR未作成ブランチはありません) | | | |"
            fi
            echo ""
            echo "### 全ブランチの乖離状況"
            echo ""
            echo "| ブランチ | mainからの先行コミット数 | 最終更新日時 |"
            echo "| --- | --- | --- |"
            for ref in $BRANCH_REFS; do
              branch="${ref#origin/}"
              ahead=$(git rev-list --count "origin/main..refs/remotes/origin/$branch" 2>/dev/null || echo '-')
              last=$(git log -1 --format='%ci' "refs/remotes/origin/$branch" | cut -d' ' -f1)
              echo "| `$branch` | $ahead | $last |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
