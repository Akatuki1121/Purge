name: Japanese commit history preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japanese-commit-history-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo
        run: python -m pip install --user git-filter-repo

      - name: Rewrite known English commit messages on a preview branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch backup/pre-japanese-commit-messages-2026-10-09 origin/main || true
          git-filter-repo --force --replace-message .github/commit-message-replacements.txt
          git remote add rewritten "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force rewritten HEAD:refs/heads/preview/japanese-commit-messages
