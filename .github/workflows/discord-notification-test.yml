name: Discord Notification Test (temporary)

# 通知経路の疎通確認専用。テスト完了後、このファイルを削除すること。
on:
  workflow_dispatch:

permissions: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send clearly labeled test notification
        env:
          WEBHOOK_URL: ${{ secrets.ACTIONS_NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::error::ACTIONS_NOTIFY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n --arg content "🧪 TEST: Purge の Discord 通知テストです。これは疎通確認用のメッセージで、障害通知ではありません。Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{content: $content}')
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "${payload}" \
            "${WEBHOOK_URL}"
          echo "Discord webhook accepted the test message."
